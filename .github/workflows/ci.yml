name: Daunted checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daunted-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Validate sprite manifests and ready sheets
        id: sprites
        continue-on-error: true
        run: npm run validate:sprites

      - name: Build offline playtest
        run: python3 tools/build-offline-playtest.py

      - name: Upload offline playtest
        uses: actions/upload-artifact@v4
        with:
          name: daunted-offline-playtest
          path: dist/Daunted_Offline_Playtest.html
          compression-level: 0
          if-no-files-found: error

      - name: Fail if validation failed
        if: steps.tests.outcome != 'success' || steps.sprites.outcome != 'success'
        run: exit 1
